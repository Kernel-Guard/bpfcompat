name: research-materialize-v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/research-materialize-v1.yml"
      - "scripts/research/materialize-v1.sh"
      - "scripts/research/verify-materialization-v1.sh"
      - "scripts/research/compare-materializations-v1.sh"
      - "research/corpus/v1/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.14"

jobs:
  materialize:
    name: Materialize frozen pilot artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm pkg-config autoconf automake \
            libtool libbpf-dev libelf-dev libzstd-dev zlib1g-dev jq curl

      - name: Install checksum-verified bpftool v7.5.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bpftool-v7.5.0-amd64.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz
          curl -fsSL -o /tmp/bpftool-v7.5.0-amd64.tar.gz.sha256sum \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz.sha256sum
          (
            cd /tmp
            sha256sum -c bpftool-v7.5.0-amd64.tar.gz.sha256sum
          )
          tar -xzf /tmp/bpftool-v7.5.0-amd64.tar.gz -C /tmp
          sudo install -m 0755 /tmp/bpftool /usr/local/bin/bpftool
          bpftool version

      - name: Materialize pilot v1 (pass A)
        run: bash scripts/research/materialize-v1.sh dist/research-corpus-v1-a

      - name: Verify materialization bundle A
        run: bash scripts/research/verify-materialization-v1.sh dist/research-corpus-v1-a

      - name: Materialize pilot v1 (pass B)
        run: bash scripts/research/materialize-v1.sh dist/research-corpus-v1-b

      - name: Verify materialization bundle B
        run: bash scripts/research/verify-materialization-v1.sh dist/research-corpus-v1-b

      - name: Assert reproducible identities
        run: >-
          bash scripts/research/compare-materializations-v1.sh
          dist/research-corpus-v1-a
          dist/research-corpus-v1-b

      - name: Publish identity summary
        if: always()
        run: |
          if [[ -s dist/research-corpus-v1-a/materialization.json ]]; then
            {
              echo "## Research pilot v1 materialization"
              echo
              echo '~~~json'
              cat dist/research-corpus-v1-a/materialization.json
              echo '~~~'
              echo
              echo "### SHA256SUMS"
              echo
              echo '~~~text'
              cat dist/research-corpus-v1-a/SHA256SUMS
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable materialization bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: research-corpus-v1-materialization-${{ github.run_id }}
          path: dist/research-corpus-v1-a/
          if-no-files-found: error
          retention-days: 90
