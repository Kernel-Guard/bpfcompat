name: ci

# Quality gate for every push and pull request. The compatibility-gate
# workflow (bpfcompat-example.yml) demonstrates running the action against
# real VMs and stays opt-in; this workflow is the cheap, fast suite that
# every PR must pass before merge:
#   - go vet
#   - golangci-lint against the new diff
#   - go test -race -coverprofile
#   - govulncheck against the pinned module set
#   - go build for all targets
#
# Everything runs on the default GitHub-hosted ubuntu-latest runner so PRs
# don't depend on the self-hosted KVM fleet to merge.
#
# Security note: every ${{ github.* }} interpolation in this file is in
# a workflow-level position (concurrency, artifact name, etc.) and never
# substituted into a "run:" shell block. None of github.event.*, head_ref,
# or commit message fields are read here, so workflow-injection attacks
# via PR titles or commit messages are not applicable to this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.9"

jobs:
  test:
    name: Test (-race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod download
        run: go mod download
      - name: Validate action.yml parses
        # The composite action ships by tag; a YAML syntax error (e.g. an
        # unquoted colon in a description) breaks every consumer at "Set up
        # job" with no way to patch the tag. Catch it before release.
        run: python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in ['action.yml'] + glob.glob('.github/workflows/*.yml')]; print('ok')"
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Documented action pins
        # v0.3.6 shipped a broken action; the docs kept pointing at it for two
        # weeks because nothing checked the pins a reader copy-pastes.
        run: bash scripts/check-doc-pins.sh
      - name: Action OCI-artifact detection regression
        # Guards the fix that lets the action accept remote OCI references
        # (ghcr.io/...) as `artifact`. Extracts is_remote_artifact() from
        # action.yml and asserts its classification, so the v0.3.2 regression
        # (OCI refs rejected as missing local files) cannot silently return.
        run: bash scripts/action-artifact-ref-detection_test.sh
      - name: Hosted compatibility-gate scope regression
        # The required hosted gate skips the VM run when its path classifier
        # says a PR is not compatibility-relevant; pkg/ and scripts/ changes
        # used to slip through. Pins scripts/hosted-gate-required.sh.
        run: bash scripts/hosted-gate-required_test.sh
      - name: Action diff-mode regression
        # baseline-report / candidate-report policy, path safety, stale-output
        # and checksum handling, against the real `bpfcompat diff` (#141).
        run: bash scripts/action-diff_test.sh
      - name: Action input-injection regression
        # The runner pastes inputs.* expressions into run: scripts as source,
        # so a consumer passing an attacker-influenced value (e.g. a PR branch
        # name) got command execution in its own job. Inputs must go through
        # env:; the guard rejects any interpolation into run:, and the
        # end-to-end test renders the real step with hostile values.
        run: |
          bash scripts/check-action-input-interpolation_test.sh
          bash scripts/action-input-injection_test.sh
      - name: Action validator identity regression
        # A release-pinned action must run the validator it downloaded and
        # verified (by path and pinned digest), not one already installed in
        # /usr/local/libexec or /usr/libexec; source-build fallbacks while
        # pinned to a release are ::warning:: annotations.
        run: bash scripts/action-validator-pin_test.sh
      - name: Action license bundle regression
        # A release-pinned action installs the release's third-party license
        # bundle, verified with the binaries, whenever SHA256SUMS lists it.
        run: bash scripts/action-license-bundle_test.sh
      - name: Compiling-toolchain proof regression
        run: bash scripts/check-binary-toolchain_test.sh
      - name: Validator build-input pin regression
        # The static validator links distro libbpf/zlib/glibc; it is built
        # from validator/build-inputs.lock, never the runner image, and a
        # stable tag must ship its release candidate's validator bytes.
        run: bash scripts/validator-build-inputs_test.sh
      - name: Distribution bundle regression
        # The release's third-party license bundle and validator relink kit
        # are generated from the build's own records, reproducibly, and refuse
        # missing or inconsistent inputs; open distribution decisions withhold
        # optional assets and block stable builds.
        run: bash scripts/distribution-bundle_test.sh
      - name: Image prefetch reliability regression
        # The public matrix lane lost five of seven weekly runs (Aug-Oct 2026)
        # to a single failed image download aborting the whole prefetch. These
        # guard the retry/partial-file/logging contract of the fetch script,
        # the never-abort contract of the matrix prefetch, and the page
        # generator's rule that an infrastructure error is never a pass/fail.
        run: |
          bash vm/scripts/fetch-cloud-image_test.sh
          bash scripts/prefetch-matrix-images_test.sh
          bash scripts/publish-compatibility-site_test.sh
          bash scripts/check-matrix-reports_test.sh
      - name: Release-asset verification regression
        run: bash scripts/verify-release-assets_test.sh
      - name: Release VM gate per-report assertion regression
        run: bash scripts/check-release-gate-reports_test.sh
      - name: One-command installer regression
        # scripts/install.sh is what README consumers pipe into sh. Runs it
        # against a local fake release (no network): signatures bound to the
        # requested tag, fail-closed verification, truncated streams, custom
        # install dirs and tag validation.
        run: bash scripts/install_test.sh
      - name: Release-state fail-closed regression
        run: bash scripts/check-release-state_test.sh
      - name: Release metadata/channel regression
        env:
          # Read-only: this suite also runs the real canary-pin check, which
          # queries the GitHub API while a new RC is being prepared.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-consistency_test.sh
      - name: Consumer-canary pin drift regression
        # The published-action canary only protects the releases it pins. A
        # stable_version bump that leaves the canary on the old commit stops
        # testing the documented consumer path; this keeps that fail-closed.
        env:
          # Read-only: this suite also runs the real canary-pin check, which
          # queries the GitHub API while a new RC is being prepared.
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-canary-pins_test.sh
      - name: Release-channel promotion regression
        run: bash scripts/promote-release_test.sh
      - name: Candidate-promotion binding regression
        run: bash scripts/verify-promotion-inputs_test.sh
      - name: Production-environment protection regression
        run: bash scripts/check-production-environment_test.sh
      - name: Production CodeQL alert-gate regression
        run: bash scripts/check-production-code-scanning_test.sh
      - name: Production-readiness evidence regression
        run: bash scripts/production-readiness-report_test.sh
      - name: Campaign-to-candidate binding regression
        # A scheduled campaign must test the designated immutable release
        # candidate (tag, commit, signed assets, attestations), not whatever
        # main happens to be.
        run: bash scripts/campaign-candidate-bind_test.sh
      - name: Campaign runner pin regression
        # The four-campaign qualification window must not span a runner-OS
        # migration of the moving ubuntu-latest label.
        run: bash scripts/campaign-runner-pin_test.sh
      - name: Canary runner pin regression
        # Release-candidate canary observations must not span a runner-OS
        # migration of the moving ubuntu-latest label.
        run: bash scripts/canary-runner-pin_test.sh
      - name: Workflow token-permission regression
        # Top-level GITHUB_TOKEN permissions stay read-only and every job-level
        # write grant is listed, with a justification, in
        # scripts/workflow-write-permissions.allow.
        run: bash scripts/check-workflow-permissions_test.sh
      - name: Research v1 release-state regression
        # scholarly-release-v1 re-runs on edits to itself; the immutable,
        # already-published research-v1 must be verified, never re-attempted.
        run: bash scripts/research-v1-release-state_test.sh
      - name: Coverage-floor regression
        run: bash scripts/check-coverage_test.sh
      - name: Release metadata consistency
        env:
          # Read-only: lets the canary-pin check verify, while a new RC is
          # being prepared, that the previous RC is a published prerelease.
          GH_TOKEN: ${{ github.token }}
        run: make check-release-consistency
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20
      - name: Enforce coverage floor
        run: bash scripts/check-coverage.sh coverage.out 50.0
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: warn

  action-diff:
    name: Action diff mode (end-to-end)
    # Runs the composite action itself (uses: ./) in diff mode, the way a
    # consumer does, and checks its outputs and its default fail-closed policy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Regression reported, policy allows it
        id: allowed
        uses: ./
        with:
          baseline-report: scripts/testdata/action-diff/baseline.json
          candidate-report: scripts/testdata/action-diff/candidate-regressed.json
          fail-on-regression: "false"
          prebuilt: never
      - name: Regression fails the step by default
        id: strict
        continue-on-error: true
        uses: ./
        with:
          baseline-report: scripts/testdata/action-diff/baseline.json
          candidate-report: scripts/testdata/action-diff/candidate-regressed.json
          diff-out: reports/strict.json
          diff-markdown: reports/strict.md
          prebuilt: never
          build: "false"
      - name: Check outputs and outcomes
        shell: bash
        env:
          ALLOWED_OUTCOME: ${{ steps.allowed.outcome }}
          ALLOWED_RESULT: ${{ steps.allowed.outputs.diff-result }}
          ALLOWED_REGRESSIONS: ${{ steps.allowed.outputs.new-required-regressions }}
          ALLOWED_JSON: ${{ steps.allowed.outputs.diff-json }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          STRICT_RESULT: ${{ steps.strict.outputs.diff-result }}
        run: |
          set -euo pipefail
          [[ "$ALLOWED_OUTCOME" == success ]]
          [[ "$ALLOWED_RESULT" == NEW_REGRESSIONS ]]
          [[ "$ALLOWED_REGRESSIONS" == 1 ]]
          jq -e '.schema_version == "bpfcompat.regression-diff.v0.1"
                 and .summary.new_required_regressions == 1' "$ALLOWED_JSON"
          [[ "$STRICT_OUTCOME" == failure ]]
          [[ "$STRICT_RESULT" == NEW_REGRESSIONS ]]
          echo "diff mode: outputs and default policy verified"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint (pull request diff)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m --new-from-rev=origin/main
      - name: Check push diff base
        id: push-diff-base
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "has_parent=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_parent=false" >> "$GITHUB_OUTPUT"
          fi
      - name: golangci-lint (push diff)
        if: github.event_name != 'pull_request' && steps.push-diff-base.outputs.has_parent == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m --new-from-rev=HEAD~1
      - name: golangci-lint (root commit bootstrap)
        if: github.event_name != 'pull_request' && steps.push-diff-base.outputs.has_parent != 'true'
        run: echo "Skipping diff lint because this checkout has no parent commit."

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...

  build:
    name: Build (Go side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The C validator (validator/c-libbpf) needs libbpf-dev + clang on the
      # builder which the example workflow already handles; here we only
      # exercise the Go side so the CI gate stays portable.
      - name: go build
        run: go build ./...
      - name: Env reference in sync with the catalog
        # docs/env-reference.md is generated from internal/envref and says
        # "do not edit by hand"; the Makefile comment said CI enforced this,
        # but no workflow ran it, so a hand edit (or a missed catalog entry)
        # could ship. Fails if regenerating the doc changes the committed file.
        run: make env-docs-check
      - name: Prove the compiling toolchain
        # go.mod only states a minimum; this asserts the stdlib actually
        # linked into the CLI comes from the pinned toolchain.
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -buildid=' -o "$RUNNER_TEMP/bpfcompat" ./cmd/bpfcompat
          bash scripts/check-binary-toolchain.sh "go${GO_VERSION}" "$RUNNER_TEMP/bpfcompat"
      # Standalone example module (own go.mod, so `go build ./...` skips it).
      - name: go build (examples/ebpf-go-loader)
        run: cd examples/ebpf-go-loader && CGO_ENABLED=0 go build ./...
