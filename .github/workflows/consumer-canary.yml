name: consumer-canary

# Consumes the *published* action exactly the way a downstream project does,
# so we break before they do.
#
# Every other lane in this repo runs the action from the working tree
# (`uses: ./`), which never exercises what an external consumer actually
# hits: resolving a pinned ref to a release, downloading and checksum-
# verifying the release assets, or building the in-guest validator from
# source on a runner that only has the documented dependencies. Both of
# those paths have broken in the past without a single red check here —
# the first scheduled run of the falcosecurity/libs lane failed that way.
#
# Three jobs, one per consumer path:
#
#   stable-prebuilt     pins the commit of the release release.yaml calls
#                       stable — the one every documented copy-paste path
#                       tells a reader to use. It is the path that broke
#                       twice: a SHA pin that failed to resolve to its
#                       release and fell back to a source build the
#                       consumer had no libbpf-dev for, and v0.3.6's
#                       verification of arm64 assets it never downloaded.
#
#   candidate-prebuilt  pins the active prerelease commit, the one downstream
#                       lanes exercise ahead of graduation. Adds attestation
#                       verification, which the v0.4 line requires and the
#                       stable line does not.
#
#   source-build        pins @main, which is not a release, forcing the source
#                       path with exactly the dependencies we document. If a
#                       future change needs another package, this job goes red
#                       before a consumer's does.
#
# The two prebuilt jobs deliberately do NOT install libbpf-dev: if release
# resolution regresses and either falls back to compiling bpfcompat, the build
# fails here instead of in a consumer's CI. They are kept as separate jobs
# rather than a matrix so a stable-only or candidate-only break is legible at
# a glance and neither can mask the other.
#
# Both pins are bound to release.yaml by scripts/check-canary-pins.sh, which
# the release-consistency gate runs on every PR: bumping stable_version
# without repinning `# bpfcompat-pin: stable` below fails CI.
#
# Scheduled ahead of the falcosecurity/libs lane (Mondays 06:00 UTC) to
# leave a working day of lead time.

# Schedule and manual dispatch only, deliberately. Every job resolves the
# action from a published ref (two release commits and @main), so a
# pull_request trigger would test those refs and not the PR's own changes —
# a green run that proves nothing about the change under review. To exercise
# a working-tree change to the action, use bpfcompat-example-hosted, which
# runs `uses: ./`. Dispatch this lane by hand before cutting a release.
on:
  schedule:
    # Sundays 18:00 UTC — ~12h before the downstream lane runs.
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-prebuilt:
    name: Consumer canary (stable release, prebuilt assets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install consumer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # Intentionally minimal: no libbpf-dev, no compiler toolchain. A
          # release-commit pin must not need them. cloud-image-utils supplies
          # cloud-localds, which RHEL-family guests require for their seed ISO.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils jq

      - name: Enable KVM on the hosted runner
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm absent - falling back to TCG (slower, still correct)."
          fi

      - name: Validate via the published action (stable release commit)
        # bpfcompat-pin: stable
        uses: Kernel-Guard/bpfcompat@179ff612ed2b5d1afb16dd9c282752028d47c415 # v0.3.7
        with:
          # Command mode with no artifact and no shipped binary, so this job
          # needs no compiler at all: the example .bpf.o objects are built,
          # not committed, and building them would drag in the toolchain this
          # job exists to prove is unnecessary. The command runs in-guest and
          # its exit code is the verdict, which exercises the whole consumer
          # path — resolve the pin to a release, download and checksum the
          # assets, boot, execute, report.
          command: uname -r && test -d /sys/fs/bpf
          matrix: matrices/canary.yaml
          out: reports/canary-stable.json
          markdown: reports/canary-stable.md
          timeout: 10m
          concurrency: "2"

      - name: Assert prebuilt binaries were used, not a source build
        run: |
          set -euo pipefail
          # "The job stayed green" is not evidence the prebuilt path ran: a
          # runner that happens to carry libbpf-dev would compile from source
          # and pass, hiding exactly the resolution regression this job
          # exists to catch. The action installs its binary under the
          # checkout of the pinned ref; if that file is byte-identical to the
          # published release asset, no source build produced it.
          shopt -s nullglob
          dirs=("${GITHUB_WORKSPACE}"/../../_actions/Kernel-Guard/bpfcompat/*/)
          if [[ "${#dirs[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one checked-out bpfcompat action ref, found ${#dirs[@]}"
            exit 1
          fi
          binary="${dirs[0]}bin/bpfcompat"
          test -x "$binary"
          actual="$(sha256sum "$binary" | awk '{print $1}')"
          expected="$(
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 \
              https://github.com/Kernel-Guard/bpfcompat/releases/download/v0.3.7/SHA256SUMS |
              awk '$2 == "bpfcompat-linux-amd64" {print $1}'
          )"
          test -n "$expected"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::action binary $actual is not the published v0.3.7 asset $expected - the action fell back to a source build"
            exit 1
          fi
          echo "action binary matches the published v0.3.7 release asset ($actual)"

      - name: Assert a compatibility report was produced
        run: |
          set -euo pipefail
          test -s reports/canary-stable.json
          jq -e '(.targets | length) > 0
                 and (.summary.status == "pass")
                 and ([.targets[].status] | all(. == "pass"))' \
            reports/canary-stable.json >/dev/null
          jq -r '.targets[] | "\(.profile_id): \(.status)"' reports/canary-stable.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-stable-${{ github.run_id }}
          if-no-files-found: warn
          path: reports/

  candidate-prebuilt:
    name: Consumer canary (release candidate, prebuilt assets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install consumer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # Intentionally minimal: no libbpf-dev, no compiler toolchain. A
          # release-commit pin must not need them. cloud-image-utils supplies
          # cloud-localds, which RHEL-family guests require for their seed ISO.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils jq

      - name: Enable KVM on the hosted runner
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm absent - falling back to TCG (slower, still correct)."
          fi

      - name: Validate via the published action (release candidate commit)
        # bpfcompat-pin: candidate
        uses: Kernel-Guard/bpfcompat@cba1e09537f2e05e4ba7278efdb5c2d044d1889b # v0.4.0-rc.3
        with:
          # Command mode with no artifact and no shipped binary, so this job
          # needs no compiler at all: the example .bpf.o objects are built,
          # not committed, and building them would drag in the toolchain this
          # job exists to prove is unnecessary. The command runs in-guest and
          # its exit code is the verdict, which exercises the whole consumer
          # path — resolve the pin to a release, download, checksum- and
          # attestation-verify the assets, boot, execute, report.
          command: uname -r && test -d /sys/fs/bpf
          matrix: matrices/canary.yaml
          out: reports/canary-prebuilt.json
          markdown: reports/canary-prebuilt.md
          timeout: 10m
          concurrency: "2"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-prebuilt-${{ github.run_id }}
          if-no-files-found: warn
          path: reports/

  source-build:
    name: Consumer canary (source build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install consumer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # The dependency set we document for source-built consumers, and
          # the one falcosecurity/libs installs. Drift here is the failure
          # this job exists to catch.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm pkg-config autoconf automake \
            libtool libelf-dev libbpf-dev zlib1g-dev \
            qemu-system-x86 qemu-utils cloud-image-utils jq

      - name: Enable KVM on the hosted runner
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm absent - falling back to TCG (slower, still correct)."
          fi

      - name: Build a loader binary and the fixture object
        run: |
          set -euo pipefail
          # Statically linked: the same binary has to run unchanged on every
          # guest in the matrix, whose libc is older than the runner's.
          make validator-static
          file validator/c-libbpf/bin/bpfcompat-validator
          # The example .bpf.o objects are gitignored build outputs, so a
          # fresh checkout has to compile them before they can be validated.
          make examples
          test -s examples/simple-pass/simple_pass.bpf.o

      - name: Validate via the published action (command mode, source build)
        uses: Kernel-Guard/bpfcompat@main
        with:
          # Command mode with a shipped binary, mirroring how
          # falcosecurity/libs drives its own loader: the per-kernel verdict
          # is the command's exit code.
          artifact: examples/simple-pass/simple_pass.bpf.o
          command: $BPFCOMPAT_BIN --artifact $BPFCOMPAT_ARTIFACT --out /tmp/validator-result.json
          command-binary: validator/c-libbpf/bin/bpfcompat-validator
          matrix: matrices/canary.yaml
          out: reports/canary-source.json
          markdown: reports/canary-source.md
          timeout: 10m
          concurrency: "2"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-source-${{ github.run_id }}
          if-no-files-found: warn
          path: reports/
