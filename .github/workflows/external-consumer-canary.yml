name: external-consumer-canary

# Continuously validates that bpfcompat still works on THREE independent
# projects' real eBPF artifacts - so we detect breakage before their pinned
# consumers do. Each exercises a different modality through the published action
# (pinned to a release, the way a consumer uses it):
#   - Inspektor Gadget : a published OCI gadget (trace_open), pulled by reference
#   - KubeArmor        : system_monitor built on-target against each kernel's BTF
#   - Falco            : scap-open (modern_bpf), the real userspace loader path
#
# Weekly + manual. A red run means a genuine regression in one of these consumer
# flows; the report job files/refreshes a single tracking issue and closes it
# when all three pass again.
#
# Security note: no ${{ github.event.* }} / head_ref / commit-message fields are
# interpolated into any run: block.

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspektor-gadget:
    name: Inspektor Gadget (published OCI gadget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils jq
      - name: Enable KVM on the hosted runner
        run: if [[ -e /dev/kvm ]]; then sudo chmod 0666 /dev/kvm || true; fi
      - name: Validate the published gadget across kernels
        uses: Kernel-Guard/bpfcompat@59ea07d2216113e86c0c9a5514be4c5c2a21d90c # v0.3.5
        with:
          artifact: ghcr.io/inspektor-gadget/gadget/trace_open:latest
          matrix: matrices/consumer-external.yaml
          out: reports/inspektor-gadget.json
          markdown: reports/inspektor-gadget.md
          timeout: 15m
          concurrency: "2"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-inspektor-gadget-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn

  kubearmor:
    name: KubeArmor (build-on-target system_monitor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils jq
      - name: Enable KVM on the hosted runner
        run: if [[ -e /dev/kvm ]]; then sudo chmod 0666 /dev/kvm || true; fi
      - name: Build system_monitor on each kernel and load it
        uses: Kernel-Guard/bpfcompat@59ea07d2216113e86c0c9a5514be4c5c2a21d90c # v0.3.5
        with:
          command: |
            set -e
            . /etc/os-release
            echo "=== $ID $VERSION_ID on $(uname -r) ==="
            case "$ID" in
              ubuntu)
                export DEBIAN_FRONTEND=noninteractive; apt-get update -qq
                apt-get install -y -qq --no-install-recommends clang llvm libelf-dev make git ca-certificates curl linux-tools-$(uname -r) \
                  || apt-get install -y -qq --no-install-recommends clang llvm libelf-dev make git ca-certificates curl linux-tools-generic
                apt-get clean; rm -rf /var/lib/apt/lists/* ;;
              almalinux|rocky|centos|rhel|ol|amzn)
                dnf install -y -q clang llvm bpftool elfutils-libelf-devel zlib-devel make git curl ;;
              *) echo "unsupported distro: $ID"; exit 91 ;;
            esac
            command -v bpftool >/dev/null || { echo "no bpftool on PATH"; exit 90; }
            cd /root
            git clone --depth 1 -q https://github.com/kubearmor/KubeArmor
            cd KubeArmor/KubeArmor/BPF
            git submodule update --init --depth 1 libbpf
            make kernel_headers >/dev/null
            make system_monitor.bpf.o >/dev/null 2>&1
            echo "built system_monitor.bpf.o against $(uname -r)"
            V=v0.3.5
            base="https://github.com/Kernel-Guard/bpfcompat/releases/download/$V"
            curl -fsSLO "$base/bpfcompat-validator-static-linux-amd64"
            curl -fsSLO "$base/SHA256SUMS"
            grep 'bpfcompat-validator-static-linux-amd64' SHA256SUMS | sha256sum -c -
            chmod +x bpfcompat-validator-static-linux-amd64
            ./bpfcompat-validator-static-linux-amd64 \
              --artifact system_monitor.bpf.o \
              --set-map-inner-map kubearmor_visibility=hash:4:4:64 \
              --out /tmp/kubearmor-load.json
          matrix: matrices/consumer-external.yaml
          disk-resize: "4"
          out: reports/kubearmor.json
          markdown: reports/kubearmor.md
          timeout: 25m
          concurrency: "2"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-kubearmor-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn

  falco:
    name: Falco (scap-open modern_bpf loader)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm pkg-config autoconf automake \
            libtool libelf-dev qemu-system-x86 qemu-utils cloud-image-utils jq
          curl -fsSL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz
          tar -xzf /tmp/bpftool.tar.gz -C /tmp
          sudo install -m 0755 /tmp/bpftool /usr/local/bin/bpftool
          bpftool version
      - name: Enable KVM on the hosted runner
        run: if [[ -e /dev/kvm ]]; then sudo chmod 0666 /dev/kvm || true; fi
      - name: Build scap-open (static, modern_bpf embedded)
        run: |
          git clone --depth 1 https://github.com/falcosecurity/libs
          cd libs && mkdir -p build && cd build
          cmake -DUSE_BUNDLED_DEPS=ON -DBUILD_LIBSCAP_MODERN_BPF=ON \
            -DMUSL_OPTIMIZED_BUILD=ON \
            -DMODERN_BPFTOOL_EXE=/usr/local/bin/bpftool \
            -DCREATE_TEST_TARGETS=OFF -DBUILD_BPF=OFF -DBUILD_DRIVER=OFF ..
          make scap-open -j"$(nproc)"
          file libscap/examples/01-open/scap-open
      - name: Validate scap-open across kernels (its real loader path)
        uses: Kernel-Guard/bpfcompat@59ea07d2216113e86c0c9a5514be4c5c2a21d90c # v0.3.5
        with:
          command: $BPFCOMPAT_BIN --modern_bpf --num_events 10
          command-binary: libs/build/libscap/examples/01-open/scap-open
          matrix: matrices/consumer-external.yaml
          out: reports/falco.json
          markdown: reports/falco.md
          timeout: 20m
          concurrency: "2"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-falco-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn

  report:
    name: File or close the canary tracking issue
    needs: [inspektor-gadget, kubearmor, falco]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          IG: ${{ needs.inspektor-gadget.result }}
          KA: ${{ needs.kubearmor.result }}
          FALCO: ${{ needs.falco.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="External consumer canary failing"
          failed=""
          [ "$IG" != "success" ] && failed="${failed}- Inspektor Gadget (OCI gadget): ${IG}\n"
          [ "$KA" != "success" ] && failed="${failed}- KubeArmor (build-on-target): ${KA}\n"
          [ "$FALCO" != "success" ] && failed="${failed}- Falco (scap-open modern_bpf): ${FALCO}\n"
          num="$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number,title \
                 --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -z "$failed" ]; then
            echo "All three consumer canaries passed."
            if [ -n "$num" ]; then gh issue close "$num" -R "$REPO" --comment "All three consumer canaries green again: $RUN_URL"; fi
            exit 0
          fi
          {
            echo "One or more independent-consumer canaries regressed. This usually means a"
            echo "bpfcompat change broke a real consumer flow (or an upstream artifact changed"
            echo "incompatibly). Investigate before the next release."
            echo
            printf "%b" "$failed"
            echo
            echo "Run: $RUN_URL"
          } > body.md
          if [ -n "$num" ]; then
            gh issue edit "$num" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md
          fi
