name: rollback-drill

# Deliberate moving-alias recovery exercise (backport of main's
# rollback-drill.yml for the v0.3.8 maintenance line). This workflow can write
# only to GHCR, never Git refs or releases, and accepts only a
# rollback-drill-vX.Y.Z-rc.N alias. Both immutable endpoints are signature,
# provenance and version verified before the alias moves. The alias is
# restored to the known-good digest on success, on step failure and on
# cancellation; if restoration itself fails the run exits 3 and
# docs/runbooks/rollback-drill-recovery.md applies. Logic and its negative
# tests live in scripts/rollback-drill.sh and scripts/rollback-drill_test.sh.
#
# Branch restriction: main accepts only refs/heads/main. On this line the
# drill is accepted only from the maintenance branch below; the
# production-drill environment's deployment-branch policy must also allow it
# (an explicit operator decision, not granted by this file).

on:
  workflow_dispatch:
    inputs:
      drill_alias:
        description: Dedicated rollback-drill-vX.Y.Z-rc.N alias.
        required: true
        type: string
      before_digest:
        description: Known-good immutable sha256 image digest (must be the current latest).
        required: true
        type: string
      candidate_digest:
        description: Candidate immutable sha256 image digest.
        required: true
        type: string
      before_version:
        description: Version embedded in the known-good image.
        required: true
        type: string
      candidate_version:
        description: Version embedded in the candidate image.
        required: true
        type: string
      before_identity:
        description: Exact Sigstore identity (release-artifacts.yml at the known-good tag).
        required: true
        type: string
      candidate_identity:
        description: Exact Sigstore identity (release-artifacts.yml at the candidate tag).
        required: true
        type: string
      confirmation:
        description: Type rollback drill followed by the drill alias.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-rollback-drill
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kernel-guard/bpfcompat
  DRILL_ALLOWED_REF: refs/heads/release/v0.3.8-centos-hotfix
  DRILL_ALIAS: ${{ inputs.drill_alias }}
  BEFORE_DIGEST: ${{ inputs.before_digest }}
  CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
  BEFORE_VERSION: ${{ inputs.before_version }}
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  BEFORE_IDENTITY: ${{ inputs.before_identity }}
  CANDIDATE_IDENTITY: ${{ inputs.candidate_identity }}
  CONFIRMATION: ${{ inputs.confirmation }}
  EVIDENCE_DIR: evidence/rollback

jobs:
  rollback:
    name: Exercise moving-alias rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-drill
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate exact drill inputs, ref and operator
        id: validate
        run: bash scripts/rollback-drill.sh validate

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.3"

      - name: Verify immutable rollback endpoints
        run: bash scripts/rollback-drill.sh verify

      - name: Promote drill alias and recover
        run: bash scripts/rollback-drill.sh drill

      - name: Verify recorded evidence
        run: |
          set -euo pipefail
          bash scripts/rollback-drill.sh verify-evidence
          cat "$EVIDENCE_DIR/evidence.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Restore drill alias after failure or cancellation
        if: (failure() || cancelled()) && steps.validate.outcome == 'success'
        run: bash scripts/rollback-drill.sh restore

      - name: Upload rollback evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rollback-drill-${{ github.run_id }}
          if-no-files-found: error
          path: evidence/rollback/**
