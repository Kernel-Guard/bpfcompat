name: release-artifacts

# The tag-triggered graph builds, verifies, signs, attests, and stages a private
# draft. It never publishes or promotes. A separate workflow_dispatch-only
# workflow re-verifies the exact run, commit, digest, and draft before promotion.

on:
  push:
    branches: [main, "release/v0.3.8-centos-hotfix"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.9"
  PYTHONDONTWRITEBYTECODE: "1"
  IMAGE: ghcr.io/kernel-guard/bpfcompat

jobs:
  build-and-sign:
    name: Build candidate, SBOM, sign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate release metadata
        run: python3 scripts/check-maintenance-release.py
      - name: Verify protected production environment
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          approval_mode="$(awk -F': ' '$1 == "approval_mode" {print $2; exit}' release.yaml)"
          bash scripts/check-production-environment.sh \
            "$GITHUB_REPOSITORY" production-release "$approval_mode"
      - name: Refuse mutation of an already-published release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-state.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Release quality gates
        run: |
          set -euo pipefail
          make check-docs-drift
          bash scripts/check-release-state_test.sh
          python3 scripts/check-maintenance-release_test.py
          python3 scripts/release-controls_test.py
          python3 scripts/native-validator-sbom_test.py
          bash scripts/check-production-environment_test.sh
          bash scripts/check-coverage_test.sh
          bash scripts/promote-release_test.sh
          bash scripts/verify-promotion-inputs_test.sh
          bash scripts/production-readiness-report_test.sh
          bash scripts/verify-release-assets_test.sh
          bash scripts/action-prebuilt-provenance_test.sh
          bash scripts/install-verification_test.sh
          bash scripts/download-hardening_test.sh
          bash scripts/check-binary-toolchain_test.sh
          bash scripts/action-prebuilt-checksums_test.sh
          bash scripts/action-artifact-ref-detection_test.sh
          bash scripts/support-matrix_test.sh
          go vet ./...
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/maintenance-coverage.out" -covermode=atomic ./...
          bash scripts/check-coverage.sh "$RUNNER_TEMP/maintenance-coverage.out" 50.0
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          make production-tech-check
      - name: Resolve build metadata
        id: meta
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          release_channel="$(awk -F': ' '$1 == "release_channel" {print $2; exit}' release.yaml)"
          if [[ "$REF" == refs/tags/* ]]; then
            version="${REF#refs/tags/}"
            channel="$release_channel"
          else
            version="v$(awk -F': ' '$1 == "release_version" {print $2; exit}' release.yaml)"
            channel="preview"
          fi
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          snapshot="$(<scripts/release-native-snapshot.txt)"
          [[ "$snapshot" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          sudo apt-get --snapshot "$snapshot" -o APT::Update::Error-Mode=any update
          mapfile -t packages < <(grep -v '^#' scripts/release-native-packages.txt)
          sudo apt-get --snapshot "$snapshot" install -y --no-install-recommends "${packages[@]}"
      - name: Repeated deterministic candidate builds
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/build-maintenance-assets.sh "$VERSION" "$GITHUB_WORKSPACE/dist"
      - name: Stage production readiness evidence
        if: startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.channel == 'stable'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          input="docs/releases/bpfcompat-${version}-readiness-input.json"
          bash scripts/production-readiness-report.sh "$input" dist/production-readiness.md dist/production-readiness.json
          jq -e --arg version "$version" '.release_version == $version and .gate_status == "ready"' dist/production-readiness.json >/dev/null
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          syft-version: v1.54.1
          format: cyclonedx-json
          output-file: dist/bpfcompat.sbom.cdx.json
      - name: Supplement actual native validator linker inputs
        run: python3 scripts/native-validator-sbom.py supplement dist/bpfcompat.sbom.cdx.json dist/NATIVE-LINK-INPUTS.json dist/bpfcompat-validator-static-linux-amd64
      - name: Compute checksums
        run: |
          set -euo pipefail
          cd dist
          assets=(
            bpfcompat-linux-amd64
            bpfcompat-linux-arm64
            bpfcompat-validator-static-linux-amd64
            BUILD-TOOLS.txt
            NATIVE-LINK-INPUTS.json
            bpfcompat.sbom.cdx.json
          )
          if [[ -s production-readiness.json && -s production-readiness.md ]]; then
            assets+=(production-readiness.json production-readiness.md)
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Attest candidate provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/bpfcompat-linux-amd64
            dist/bpfcompat-linux-arm64
            dist/bpfcompat-validator-static-linux-amd64
            dist/BUILD-TOOLS.txt
            dist/NATIVE-LINK-INPUTS.json
            dist/bpfcompat.sbom.cdx.json
      - name: Attest production readiness evidence
        if: startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.channel == 'stable'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/production-readiness.json
            dist/production-readiness.md
      - name: Attest candidate SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/bpfcompat-linux-amd64
            dist/bpfcompat-linux-arm64
            dist/bpfcompat-validator-static-linux-amd64
          sbom-path: dist/bpfcompat.sbom.cdx.json
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.3"
      - name: Sign checksums and SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.crt
          cosign sign-blob --yes dist/bpfcompat.sbom.cdx.json \
            --output-signature dist/bpfcompat.sbom.cdx.sig \
            --output-certificate dist/bpfcompat.sbom.cdx.crt
      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpfcompat-release-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
      - name: Upload production technical evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-tech-evidence-${{ steps.meta.outputs.version }}
          path: evidence/production-tech/
          if-no-files-found: error

  candidate-vm-gate:
    name: Candidate VM positive + classified negative
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-release-${{ needs.build-and-sign.outputs.version }}
          path: dist
      - name: Verify candidate attestations
        env:
          GH_TOKEN: ${{ github.token }}
          BPFCOMPAT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          BPFCOMPAT_EXPECTED_SOURCE_REF: ${{ github.ref }}
        run: >
          bash scripts/verify-release-assets.sh
          dist Kernel-Guard/bpfcompat
          bpfcompat-linux-amd64
          bpfcompat-validator-static-linux-amd64
      - name: Install VM dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils clang llvm \
            libbpf-dev libelf-dev zlib1g-dev pkg-config jq
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
      - name: Required fresh-cache CentOS validation
        env:
          EXPECTED_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x dist/bpfcompat-linux-amd64 dist/bpfcompat-validator-static-linux-amd64
          test "$(dist/bpfcompat-linux-amd64 version --json | jq -r .version)" = "$EXPECTED_VERSION"
          bash scripts/maintenance-vm-gate.sh "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/maintenance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p reports
          cp "$RUNNER_TEMP/maintenance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"/reports/* reports/
          printf 'name: action-maintenance\nprofiles:\n  - id: centos-stream-9-5.14\n    required: true\n' >"$RUNNER_TEMP/action-maintenance.yaml"
      - name: Candidate Action contract smoke
        uses: ./
        with:
          command: uname -r && test -d /sys/fs/bpf
          matrix: ${{ runner.temp }}/action-maintenance.yaml
          out: reports/action-maintenance.json
          markdown: reports/action-maintenance.md
          timeout: 12m
          concurrency: "1"
          binary: dist/bpfcompat-linux-amd64
          build: "false"
          prebuilt: "never"
      - name: Retain incomplete VM evidence
        if: always()
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/maintenance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p release-evidence/reports
          if [[ -d reports ]]; then
            find reports -maxdepth 1 -type f -name 'action-maintenance.*' -exec cp '{}' release-evidence/reports/ \;
          fi
          if [[ -d "$source/reports" ]]; then
            find "$source/reports" -maxdepth 1 -type f -exec cp '{}' release-evidence/reports/ \;
          fi
          if [[ -d "$source" ]]; then
            cd "$source"
            find . -type f \( -name serial.log -o -name qemu.log -o -name libbpf.log -o -name validator-result.json -o -name validator.stderr \) -exec cp --parents '{}' "$GITHUB_WORKSPACE/release-evidence/" \;
          fi
      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-evidence-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: warn

  candidate-arm64-cli-gate:
    name: Candidate ARM64 CLI native smoke
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-sign
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-release-${{ needs.build-and-sign.outputs.version }}
          path: dist
      - name: Verify ARM64 candidate attestation
        env:
          GH_TOKEN: ${{ github.token }}
          BPFCOMPAT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          BPFCOMPAT_EXPECTED_SOURCE_REF: ${{ github.ref }}
        run: >
          bash scripts/verify-release-assets.sh
          dist Kernel-Guard/bpfcompat
          bpfcompat-linux-arm64
      - name: Execute ARM64 candidate natively
        env:
          EXPECTED_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          chmod +x dist/bpfcompat-linux-arm64
          actual="$(dist/bpfcompat-linux-arm64 version --json | jq -r .version)"
          test "$actual" = "$EXPECTED_VERSION"
          dist/bpfcompat-linux-arm64 --help >/dev/null

  build-candidate-image:
    name: Build, verify, sign candidate image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-sign, candidate-vm-gate, candidate-arm64-cli-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-release-${{ needs.build-and-sign.outputs.version }}
          path: dist
      - name: Verify image payloads
        env:
          GH_TOKEN: ${{ github.token }}
          BPFCOMPAT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          BPFCOMPAT_EXPECTED_SOURCE_REF: ${{ github.ref }}
        run: |
          bash scripts/verify-release-assets.sh dist "$GITHUB_REPOSITORY" bpfcompat-linux-amd64 bpfcompat-linux-arm64
          cp Dockerfile.release dist/Dockerfile
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          target: final
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.build-and-sign.outputs.version }}
            COMMIT=${{ needs.build-and-sign.outputs.commit }}
            BUILD_DATE=${{ needs.build-and-sign.outputs.build_date }}
      - name: Verify candidate image version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm "${IMAGE}@${DIGEST}" version --json | jq -r .version)"
          test "$actual" = "$EXPECTED_VERSION"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.3"
      - name: Sign candidate image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest candidate image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  assemble-candidate-evidence:
    name: Assemble candidate promotion evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-sign
      - candidate-vm-gate
      - candidate-arm64-cli-gate
      - build-candidate-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-release-${{ needs.build-and-sign.outputs.version }}
          path: candidate/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate-evidence-${{ github.run_id }}
          path: candidate/vm
      - name: Bind promotion evidence to exact inputs and outputs
        env:
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.build-and-sign.outputs.channel }}
          IMAGE_DIGEST: ${{ needs.build-candidate-image.outputs.digest }}
        run: |
          set -euo pipefail
          positive="candidate/vm/reports/release-positive.json"
          negative="candidate/vm/reports/release-negative.json"
          identity="candidate/vm/reports/release-artifact-identity.json"
          test -s "$identity"
          jq -e --arg commit "$GITHUB_SHA" '.source_commit == $commit and .positive_exit == 0 and .negative_exit == 2' "$identity" >/dev/null
          checksums="candidate/dist/SHA256SUMS"
          test -s "$positive"
          test -s "$negative"
          test -s "$checksums"
          jq -e --arg sha "$(sha256sum candidate/dist/bpfcompat-linux-amd64 | awk '{print $1}')" '.cli_sha256 == $sha' "$identity" >/dev/null
          jq -e --arg sha "$(sha256sum candidate/dist/bpfcompat-validator-static-linux-amd64 | awk '{print $1}')" '.validator_sha256 == $sha' "$identity" >/dev/null
          jq -e '.summary.status == "pass"' "$positive" >/dev/null
          jq -e '
            .summary.status == "fail" and
            ([.targets[] | select(.status == "infra_error")] | length == 0)
          ' "$negative" >/dev/null
          mkdir -p candidate/evidence
          jq -n \
            --arg schema_version "v0.1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW_REF" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg tag "$RELEASE_VERSION" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg image "${IMAGE}@${IMAGE_DIGEST}" \
            --arg checksums_sha256 "$(sha256sum "$checksums" | awk '{print $1}')" \
            --arg positive_report_sha256 "$(sha256sum "$positive" | awk '{print $1}')" \
            --arg negative_report_sha256 "$(sha256sum "$negative" | awk '{print $1}')" \
            --arg artifact_identity_sha256 "$(sha256sum "$identity" | awk '{print $1}')" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              workflow: $workflow,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              commit_sha: $commit_sha,
              tag: $tag,
              channel: $channel,
              image: $image,
              checksums_sha256: $checksums_sha256,
              positive_report_sha256: $positive_report_sha256,
              negative_report_sha256: $negative_report_sha256,
              artifact_identity_sha256: $artifact_identity_sha256,
              generated_at: $generated_at
            }' >candidate/evidence/release-candidate-evidence.json
      - name: Attest candidate promotion evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate/evidence/release-candidate-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpfcompat-candidate-evidence-${{ needs.build-and-sign.outputs.version }}
          path: candidate/evidence/release-candidate-evidence.json
          if-no-files-found: error

  stage-draft-release:
    name: Stage draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-sign, assemble-candidate-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-release-${{ needs.build-and-sign.outputs.version }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpfcompat-candidate-evidence-${{ needs.build-and-sign.outputs.version }}
          path: dist
      - name: Re-verify staging identity
        env:
          GH_TOKEN: ${{ github.token }}
          BPFCOMPAT_EXPECTED_SOURCE_SHA: ${{ github.sha }}
          BPFCOMPAT_EXPECTED_SOURCE_REF: ${{ github.ref }}
        run: |
          bash scripts/check-release-state.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          bash scripts/verify-release-assets.sh dist "$GITHUB_REPOSITORY" bpfcompat-linux-amd64 bpfcompat-linux-arm64 bpfcompat-validator-static-linux-amd64 BUILD-TOOLS.txt NATIVE-LINK-INPUTS.json bpfcompat.sbom.cdx.json
          gh attestation verify dist/release-candidate-evidence.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.build-and-sign.outputs.channel == 'prerelease' }}
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/bpfcompat-linux-amd64
            dist/bpfcompat-linux-arm64
            dist/bpfcompat-validator-static-linux-amd64
            dist/SHA256SUMS
