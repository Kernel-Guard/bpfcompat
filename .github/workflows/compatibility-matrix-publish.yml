name: compatibility-matrix-publish

# Publishes the public compatibility matrix: the library of known-tricky
# vendor kernels (matrices/quirk-library.yaml) validated against a contrast
# pair of artifacts, regenerated weekly and deployed to GitHub Pages.
#
# The pair is chosen to make the "kernel version != eBPF feature support"
# story visible in one table:
#   - ringbuf-modern: fails upstream < 5.8 but PASSES AlmaLinux 8's 4.18
#     (RHEL backport) while FAILING Amazon Linux 2's 4.14 (no backport);
#   - simple-pass: loads everywhere, proving the failures above are feature
#     gaps, not broken kernels.
#
# Runs on a stock GitHub-hosted runner (/dev/kvm is exposed; TCG fallback
# otherwise). Non-blocking by design: scheduled + manually dispatched.

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy generated compatibility site to GitHub Pages.
        required: false
        default: "true"
  schedule:
    # Weekly, Tuesday 06:00 UTC
    - cron: "0 6 * * 2"

# Least privilege at the top; write scopes are granted per-job below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-compatibility-matrix:
    name: Publish compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: write     # deploy the compatibility site to GitHub Pages
      id-token: write  # OIDC for Pages deployment

    steps:
      - name: Record job start time
        # Lower bound for report provenance: a report whose run.started_at is
        # earlier than this was not produced by this job and is never published.
        shell: bash
        run: echo "BPFCOMPAT_JOB_STARTED_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report KVM acceleration status
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "::notice::/dev/kvm present - VM validation is hardware-accelerated."
            # Some hosted images expose /dev/kvm but the runner user is not in
            # the kvm group; loosen perms so QEMU can open it.
            sudo chmod 0666 /dev/kvm || true
            ls -l /dev/kvm || true
          else
            echo "::warning::/dev/kvm not found - falling back to TCG software emulation (slower, still correct)."
          fi

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # cloud-image-utils provides cloud-localds: the RHEL-family/Amazon/
          # Oracle/SUSE profiles deliver cloud-init via a cidata seed ISO, and
          # without cloud-localds bpfcompat falls back to a vvfat config drive
          # that those guests never boot from (0-byte serial, SSH timeout) —
          # exactly the 7 infra_errors in runs 28555255212 / 28584050911.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils clang llvm libbpf-dev \
            libelf-dev zlib1g-dev pkg-config jq

      - name: Free hosted-runner disk space
        # The 11 quirk-library images total ~11 GB; the stock runner has ~14 GB
        # free on /. Dropping the unused Android/.NET/GHC toolchains frees
        # another ~14 GB so image downloads + overlays never hit ENOSPC.
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / | tail -1

      - name: Build validator and fixture artifacts
        id: build
        shell: bash
        run: |
          set -euo pipefail
          make validator-static
          make examples

      - name: Prefetch quirk-library images
        # Downloads happen here, in parallel, NOT inside each target's
        # validation window. The first publish run proved why: the 1.4-2 GB
        # enterprise images (AlmaLinux/Rocky/CentOS/Amazon/Oracle) blew the
        # per-target timeout on a cold runner ("wait for SSH: not ready"),
        # while the small Ubuntu/Debian images validated fine.
        #
        # The prefetch never aborts the lane. Runs 33499929031 (HTTP/2
        # PROTOCOL_ERROR), 36565005828 and 37464388426 (HTTP 502 for a renamed
        # CentOS Stream image) each failed here under `set -e` + xargs, so no
        # VM booted, no report existed, and the public page silently stayed
        # on the previous week. Now each image is retried, every outcome is
        # written to a summary that is uploaded as evidence, and validation
        # proceeds: a target whose image is still missing is recorded as
        # INFRA_ERROR by bpfcompat itself -- never as a PASS or a FAIL.
        id: prefetch
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          bash scripts/prefetch-matrix-images.sh matrices/quirk-library.yaml reports/prefetch-summary.txt
          rc=$?
          echo "prefetch_rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 2 ]]; then
            echo "::warning::one or more quirk-library images could not be prefetched; affected targets will surface as INFRA_ERROR, not as compatibility verdicts (see reports/prefetch-summary.txt)"
          elif [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi
          ls -lh vm/cache/ || true
          df -h / | tail -1

      - name: Validate ringbuf-modern across the quirk library
        # Runs whenever the fixtures were built and the prefetch step itself
        # did not error out (a prefetch exit 2 -- some images missing -- is
        # handled inside that step). A non-zero exit here (required
        # INCOMPATIBLE or INFRA_ERROR) still fails the job; it must not stop
        # the contrast artifact below from being validated and published.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.prefetch.outcome == 'success' }}
        uses: ./
        with:
          artifact: examples/ringbuf-modern/ringbuf_modern.bpf.o
          matrix: matrices/quirk-library.yaml
          validation-mode: load_attach
          out: reports/quirk-library-ringbuf-modern.json
          markdown: reports/quirk-library-ringbuf-modern.md
          timeout: 15m
          concurrency: "2"
          build: "true"

      - name: Validate simple-pass across the quirk library
        # Images are already prefetched, so this pass only boots VMs. Runs even
        # if the ringbuf-modern step failed: the page needs both reports to
        # show that a failure is a feature gap and not a broken kernel.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.prefetch.outcome == 'success' }}
        uses: ./
        with:
          artifact: examples/simple-pass/simple_pass.bpf.o
          matrix: matrices/quirk-library.yaml
          validation-mode: load_attach
          out: reports/quirk-library-simple-pass.json
          markdown: reports/quirk-library-simple-pass.md
          timeout: 15m
          concurrency: "2"
          build: "false"

      - name: Generate static compatibility index
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(date -u +%Y%m%d)-run${GITHUB_RUN_ID}"
          fi
          export BPFCOMPAT_COMPATIBILITY_VERSION="$version"
          bash scripts/publish-compatibility-site.sh reports public/compatibility

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bpfcompat-compatibility-matrix-${{ github.run_id }}
          if-no-files-found: warn
          # Allowlist only — never `.bpfcompat/runs/**` wholesale: the per-run
          # dir also holds the generated SSH private key (id_ed25519), the
          # cloud-init seed, and the disk overlay, none of which belong in a
          # downloadable artifact.
          path: |
            public/compatibility/index.html
            public/compatibility/index.md
            reports/quirk-library-*.json
            reports/quirk-library-*.md
            reports/prefetch-summary.txt
            reports/prefetch-summary.txt.fetch.log
            .bpfcompat/runs/**/targets/**/serial.log
            .bpfcompat/runs/**/targets/**/qemu.log
            .bpfcompat/runs/**/targets/**/libbpf.log
            .bpfcompat/runs/**/targets/**/validator-result.json
            .bpfcompat/runs/**/targets/**/validator.stderr

      - name: Decide whether this run's evidence may be published
        # Publishing after a failed validation step is deliberate: the job
        # stays red (that is the workflow verdict), while the page shows the
        # latest observed state with INFRA_ERROR cells and an "incomplete"
        # banner instead of silently keeping last week's page. What may be
        # published is gated here: BOTH expected reports must exist, be v0.1,
        # have started after this job began, cover exactly the quirk-library
        # profiles, and name the artifact bytes built in this run. Otherwise
        # nothing is deployed and the previous page stays.
        id: evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/check-matrix-reports.sh reports matrices/quirk-library.yaml \
            "${BPFCOMPAT_JOB_STARTED_EPOCH:?job start time not recorded}" \
            quirk-library-ringbuf-modern.json=examples/ringbuf-modern/ringbuf_modern.bpf.o \
            quirk-library-simple-pass.json=examples/simple-pass/simple_pass.bpf.o
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::this run's reports did not pass the publication checks (rc=$rc); the published page is left unchanged"
          fi

      - name: Configure Pages
        if: always() && steps.evidence.outputs.publishable == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == 'true'))
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: always() && steps.evidence.outputs.publishable == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == 'true'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public/compatibility

      - name: Deploy Pages
        if: always() && steps.evidence.outputs.publishable == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == 'true'))
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
