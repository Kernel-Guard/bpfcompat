name: BPFCompat eBPF Compatibility Gate
author: Kernel Guard
description: Validate eBPF .bpf.o artifacts across Linux kernel profiles and fail CI on compatibility regressions.

inputs:
  suite:
    description: Optional suite YAML. When set, the action runs bpfcompat suite instead of single-artifact mode.
    required: false
    default: ""
  artifact:
    description: "Local path to a compiled .bpf.o artifact, or a remote OCI reference the CLI pulls (for example ghcr.io/org/gadget:latest, host:port/repo, or an @sha256: digest). Prefix workspace paths whose first directory contains `.` or `:` or is `localhost` with `./` (for example ./.output/minimal.bpf.o); otherwise they are treated as remote references."
    required: false
    default: ""
  command:
    description: "Command-mode validation: shell command run as root inside each kernel VM; the per-kernel verdict is its exit code. Use instead of (or alongside) artifact to validate via your project's own loader binary. Exposes $BPFCOMPAT_BIN, $BPFCOMPAT_ARTIFACT, and $BPFCOMPAT_REMOTE_ROOT."
    required: false
    default: ""
  command-binary:
    description: Local loader executable shipped into each guest and exposed to command as $BPFCOMPAT_BIN.
    required: false
    default: ""
  command-expect-exit:
    description: Exit code that counts as a pass in command mode.
    required: false
    default: "0"
  disk-resize:
    description: "Grow each guest overlay disk by N GiB before boot (cloud-init growpart expands it). Use for command-mode lanes that install a toolchain or build inside near-full cloud images. 0 (default) leaves the image size unchanged."
    required: false
    default: "0"
  matrix:
    description: "Path to matrix YAML. A bare name (for example quirk-library) that does not exist in the caller repository resolves to the matching matrices/<name>.yaml shipped with the action."
    required: false
    default: ""
  out:
    description: Path to JSON report output.
    required: false
    default: ""
  suite-out:
    description: Path to suite JSON summary output when suite mode is used.
    required: false
    default: "reports/bpfcompat-suite.json"
  suite-markdown:
    description: Path to suite Markdown summary output when suite mode is used.
    required: false
    default: "reports/bpfcompat-suite.md"
  manifest:
    description: Path to manifest YAML.
    required: false
    default: ""
  validation-mode:
    description: "Optional single-artifact validation mode: load_only, load_attach, or behavior. Suite mode should set validation_mode inside the suite YAML."
    required: false
    default: ""
  markdown:
    description: Path to Markdown report output.
    required: false
    default: ""
  timeout:
    description: Per-target timeout (for example 180s, 8m).
    required: false
    default: "180s"
  workdir:
    description: Working directory root.
    required: false
    default: ".bpfcompat"
  concurrency:
    description: Maximum concurrent VM jobs.
    required: false
    default: "2"
  keep-vm-on-failure:
    description: Keep VM overlays/logs on target failure.
    required: false
    default: "false"
  build:
    description: Build ./bin/bpfcompat with make before running tests.
    required: false
    default: "true"
  prebuilt:
    description: Use prebuilt release binaries when the action is pinned to a release tag or to a commit SHA that matches a release tag ("auto"), or always build from source ("never"). Downloads are checksum-checked and verified against GitHub build attestations, and the run then uses that verified validator by path and pinned digest (a workflow that sets BPFCOMPAT_VALIDATOR_BIN or BPFCOMPAT_VALIDATOR_SHA256 keeps its own settings, with a warning). Runners without gh build from source; while pinned to a release, every fallback to a source build is reported as a warning because the run then does not use the attested release validator.
    required: false
    default: "auto"
  binary:
    description: Path to bpfcompat binary. Relative paths are resolved from the caller repository root. An executable at this path in the workspace is used instead of the verified prebuilt CLI.
    required: false
    default: "./bin/bpfcompat"
  baseline-report:
    description: "Diff mode: path to the baseline (reference release) bpfcompat JSON report. Setting baseline-report and candidate-report runs `bpfcompat diff` instead of validating; it cannot be combined with artifact, command, or suite. Paths must resolve inside the workspace or RUNNER_TEMP."
    required: false
    default: ""
  candidate-report:
    description: "Diff mode: path to the candidate (release under evaluation) bpfcompat JSON report."
    required: false
    default: ""
  baseline-report-sha256:
    description: "Diff mode: optional expected SHA-256 of baseline-report; a mismatch fails the step before comparing."
    required: false
    default: ""
  candidate-report-sha256:
    description: "Diff mode: optional expected SHA-256 of candidate-report; a mismatch fails the step before comparing."
    required: false
    default: ""
  fail-on-regression:
    description: "Diff mode: fail when a required kernel the baseline supported is broken in the candidate (NEW_REGRESSION)."
    required: false
    default: "true"
  fail-on-incomplete:
    description: "Diff mode: fail when a required comparison could not be established (INCONCLUSIVE: infrastructure error, missing result, different kernel, or removed coverage). Invalid or unreadable reports always fail."
    required: false
    default: "true"
  diff-out:
    description: "Diff mode: path for the diff JSON."
    required: false
    default: "reports/bpfcompat-diff.json"
  diff-markdown:
    description: "Diff mode: path for the diff Markdown (also appended to the step summary)."
    required: false
    default: "reports/bpfcompat-diff.md"

outputs:
  diff-result:
    description: "Diff mode: NO_NEW_REGRESSIONS, NEW_REGRESSIONS, INCONCLUSIVE, or INVALID_INPUT."
    value: ${{ steps.run.outputs.result }}
  new-required-regressions:
    description: "Diff mode: number of new required regressions."
    value: ${{ steps.run.outputs.new-required-regressions }}
  inconclusive-required:
    description: "Diff mode: number of required comparisons that could not be established."
    value: ${{ steps.run.outputs.inconclusive-required }}
  coverage-removed-required:
    description: "Diff mode: number of required profiles the baseline tested and the candidate did not."
    value: ${{ steps.run.outputs.coverage-removed-required }}
  diff-json:
    description: "Diff mode: absolute path of the diff JSON."
    value: ${{ steps.run.outputs.diff-json }}
  diff-markdown:
    description: "Diff mode: absolute path of the diff Markdown."
    value: ${{ steps.run.outputs.diff-markdown }}

runs:
  using: composite
  steps:
    - name: Download prebuilt binaries
      id: prebuilt
      if: ${{ inputs.prebuilt != 'never' }}
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        GITHUB_API_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "resolved=false" >> "$GITHUB_OUTPUT"
        ref="${ACTION_REF:-}"
        if [[ "$ref" =~ ^[0-9a-f]{40}$ ]] && command -v jq >/dev/null 2>&1; then
          # Pinned by commit SHA (the recommended way to pin third-party
          # actions). Resolve the commit to the release tag that points at it
          # so SHA-pinned consumers still get prebuilt binaries instead of
          # silently requiring libbpf build deps on the runner. Any API
          # hiccup or no matching tag falls through to the source build.
          tags_json="$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Kernel-Guard/bpfcompat/tags?per_page=100" || true)"
          resolved_tag="$(printf '%s' "$tags_json" \
            | jq -r --arg sha "$ref" \
              '[.[] | select(.commit.sha == $sha) | .name | select(test("^v[0-9]"))][0] // empty' \
            2>/dev/null || true)"
          if [[ -n "$resolved_tag" ]]; then
            echo "Commit ${ref} is release ${resolved_tag}; using its prebuilt binaries."
            ref="$resolved_tag"
          fi
        fi
        if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
          # A commit pin that could not be mapped to a release (no matching
          # tag, API error, rate limit, or no jq). The commit may still be a
          # release, so say what the source build below means for this run.
          echo "::warning::Could not map commit ${ref} to a bpfcompat release tag; building from source. This run does not use the attested release binaries or validator."
          exit 0
        fi
        if [[ ! "$ref" =~ ^v[0-9] ]]; then
          echo "Action not pinned to a release tag (ref: ${ref:-none}); building from source."
          exit 0
        fi
        # From here the action is pinned to a release: any fallback to a
        # source build replaces the attested release binaries and validator
        # with ones built from the runner's own toolchain and libbpf, so it is
        # annotated as a warning rather than logged as a routine line.
        if [[ "$(uname -m)" != "x86_64" ]]; then
          echo "::warning::No prebuilt binaries for $(uname -m); building from source. This run does not use the attested ${ref} binaries or validator."
          exit 0
        fi

        base="https://github.com/Kernel-Guard/bpfcompat/releases/download/${ref}"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        for asset in bpfcompat-linux-amd64 bpfcompat-validator-static-linux-amd64 SHA256SUMS; do
          if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 300 \
            -o "$tmp/$asset" "$base/$asset"; then
            echo "::warning::Release asset $asset not available for ${ref}; building from source. This run does not use the attested ${ref} binaries or validator."
            exit 0
          fi
        done
        # The third-party license bundle ships with the binaries when the
        # release lists it in SHA256SUMS (older releases do not); it is then
        # downloaded and verified together with them.
        license_asset="bpfcompat-third-party-licenses.tar.gz"
        verify_assets=(bpfcompat-linux-amd64 bpfcompat-validator-static-linux-amd64)
        if awk -v f="$license_asset" '$2 == f || $2 == "*" f { found = 1 } END { exit !found }' "$tmp/SHA256SUMS"; then
          if ! curl -fsSL --retry 2 --connect-timeout 10 --max-time 300 \
            -o "$tmp/$license_asset" "$base/$license_asset"; then
            echo "::warning::Release asset $license_asset not available for ${ref}; building from source. This run does not use the attested ${ref} binaries or validator."
            exit 0
          fi
          verify_assets+=("$license_asset")
        fi
        if ! command -v gh >/dev/null 2>&1 || ! gh attestation --help >/dev/null 2>&1; then
          echo "::warning::GitHub CLI attestation verification is unavailable; building from the pinned Action source instead of using unverifiable prebuilt binaries. This run does not use the attested ${ref} validator."
          exit 0
        fi
        # Verification is bound to this exact release (tag ref and commit),
        # which needs --signer-workflow (gh 2.51.0) and --source-ref and
        # --source-digest (gh 2.68.0). Ask gh's own help, as scripts/install.sh
        # does, rather than its version.
        gh_help="$(gh attestation verify --help 2>&1 || true)"
        gh_lacks=""
        for flag in --signer-workflow --source-ref --source-digest; do
          grep -Eq -- "(^|[^[:alnum:]-])${flag}([^[:alnum:]-]|\$)" <<<"$gh_help" ||
            gh_lacks="${gh_lacks:+$gh_lacks }$flag"
        done
        if [[ -n "$gh_lacks" ]]; then
          echo "::warning::GitHub CLI cannot bind attestations to the release ('gh attestation verify' lacks ${gh_lacks}; needs gh >= 2.68.0); building from the pinned Action source instead of using unverifiable prebuilt binaries. This run does not use the attested ${ref} validator."
          exit 0
        fi
        # The commit the release was built from: a SHA pin names it; a tag
        # pin is resolved to the commit the tag points at (peeled when
        # annotated). If that fails or does not finish within 60 s (the
        # bound of the tags API call above), build from source rather than
        # install binaries that cannot be bound to this release.
        source_sha="${ACTION_REF:-}"
        if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
          source_sha=""
          if tag_refs="$(GIT_TERMINAL_PROMPT=0 timeout 60 git ls-remote https://github.com/Kernel-Guard/bpfcompat.git \
            "refs/tags/${ref}" "refs/tags/${ref}^{}" 2>/dev/null)"; then
            source_sha="$(awk -v tag="refs/tags/${ref}" '
              $2 == tag && !peeled { sha = $1 }
              $2 == (tag "^{}") { sha = $1; peeled = 1 }
              END { print sha }
            ' <<<"$tag_refs")"
          fi
        fi
        if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::warning::Could not resolve release ${ref} to its commit; building from the pinned Action source instead of using prebuilt binaries that cannot be bound to the release. This run does not use the attested ${ref} binaries or validator."
          exit 0
        fi
        # A failed verification is a hard error, not a fallback: assets exist
        # but do not match what this release's workflow run published or
        # attested.
        GH_TOKEN="$GITHUB_API_TOKEN" \
          BPFCOMPAT_EXPECTED_SOURCE_SHA="$source_sha" \
          BPFCOMPAT_EXPECTED_SOURCE_REF="refs/tags/${ref}" \
          bash "$GITHUB_ACTION_PATH/scripts/verify-release-assets.sh" \
          "$tmp" Kernel-Guard/bpfcompat "${verify_assets[@]}"

        mkdir -p "$GITHUB_ACTION_PATH/bin" "$GITHUB_ACTION_PATH/validator/c-libbpf/bin"
        install -m 0755 "$tmp/bpfcompat-linux-amd64" "$GITHUB_ACTION_PATH/bin/bpfcompat"
        install -m 0755 "$tmp/bpfcompat-validator-static-linux-amd64" "$GITHUB_ACTION_PATH/validator/c-libbpf/bin/bpfcompat-validator"
        # Hand the run step the validator just verified, by path and by the
        # digest SHA256SUMS lists for it. Without this the CLI's search order
        # (/usr/local/libexec, /usr/libexec, then this checkout) would run an
        # older installed validator on a self-hosted runner instead.
        validator_bin="$GITHUB_ACTION_PATH/validator/c-libbpf/bin/bpfcompat-validator"
        validator_sha="$(awk '$2 == "bpfcompat-validator-static-linux-amd64" || $2 == "*bpfcompat-validator-static-linux-amd64" { print $1 }' "$tmp/SHA256SUMS")"
        installed_sha="$(sha256sum "$validator_bin" | awk '{ print $1 }')"
        if [[ ! "$validator_sha" =~ ^[0-9a-f]{64}$ || "$validator_sha" != "$installed_sha" ]]; then
          echo "::error::Installed validator does not match its verified SHA256SUMS entry (${validator_sha:-missing} vs ${installed_sha})."
          exit 1
        fi
        if [[ " ${verify_assets[*]} " == *" $license_asset "* ]]; then
          mkdir -p "$tmp/licenses"
          tar -xzf "$tmp/$license_asset" -C "$tmp/licenses"
          if [[ ! -f "$tmp/licenses/bpfcompat-third-party-licenses/INVENTORY.json" ]]; then
            echo "::error::Verified $license_asset does not have the expected layout."
            exit 1
          fi
          license_dir="$GITHUB_ACTION_PATH/share/doc/bpfcompat"
          mkdir -p "$license_dir"
          cp -R "$tmp/licenses/bpfcompat-third-party-licenses/." "$license_dir/"
          echo "Third-party license texts for ${ref}: ${license_dir}"
        else
          echo "Release ${ref} publishes no third-party license bundle; see LICENSE, NOTICE and THIRD_PARTY_NOTICES.md in the action checkout."
        fi
        echo "validator-bin=$validator_bin" >> "$GITHUB_OUTPUT"
        echo "validator-sha256=$validator_sha" >> "$GITHUB_OUTPUT"
        echo "resolved=true" >> "$GITHUB_OUTPUT"
        echo "Using prebuilt release binaries for ${ref}."

    - name: Build bpfcompat
      if: ${{ inputs.build == 'true' && steps.prebuilt.outputs.resolved != 'true' }}
      shell: bash
      env:
        INPUT_BASELINE_REPORT: ${{ inputs.baseline-report }}
        INPUT_CANDIDATE_REPORT: ${{ inputs.candidate-report }}
      run: |
        set -euo pipefail
        if [[ -z "${GITHUB_ACTION_PATH:-}" ]]; then
          echo "::error::GITHUB_ACTION_PATH is not set"
          exit 1
        fi

        pushd "$GITHUB_ACTION_PATH" >/dev/null
        make build
        # Diff mode only reads reports; it never boots a guest, so it does not
        # need the static validator (or the libbpf headers that build needs).
        if [[ -z "$INPUT_BASELINE_REPORT$INPUT_CANDIDATE_REPORT" ]]; then
          make validator-static
        fi
        popd >/dev/null

    - name: Run bpfcompat
      id: run
      shell: bash
      env:
        # Every input reaches the script through the environment, never
        # inline expression interpolation: the runner pastes an interpolated
        # value into the script text, so a caller-controlled value would be
        # shell source (CI: scripts/check-action-input-interpolation.sh).
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_COMMAND_BINARY: ${{ inputs.command-binary }}
        INPUT_COMMAND_EXPECT_EXIT: ${{ inputs.command-expect-exit }}
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_BASELINE_REPORT: ${{ inputs.baseline-report }}
        INPUT_CANDIDATE_REPORT: ${{ inputs.candidate-report }}
        INPUT_BASELINE_REPORT_SHA256: ${{ inputs.baseline-report-sha256 }}
        INPUT_CANDIDATE_REPORT_SHA256: ${{ inputs.candidate-report-sha256 }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
        INPUT_DIFF_OUT: ${{ inputs.diff-out }}
        INPUT_DIFF_MARKDOWN: ${{ inputs.diff-markdown }}
        INPUT_MATRIX: ${{ inputs.matrix }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_MARKDOWN: ${{ inputs.markdown }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_SUITE_OUT: ${{ inputs.suite-out }}
        INPUT_SUITE_MARKDOWN: ${{ inputs.suite-markdown }}
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        PREBUILT_RESOLVED: ${{ steps.prebuilt.outputs.resolved }}
        PREBUILT_VALIDATOR_BIN: ${{ steps.prebuilt.outputs.validator-bin }}
        PREBUILT_VALIDATOR_SHA256: ${{ steps.prebuilt.outputs.validator-sha256 }}
        INPUT_DISK_RESIZE: ${{ inputs.disk-resize }}
        INPUT_VALIDATION_MODE: ${{ inputs.validation-mode }}
        INPUT_KEEP_VM_ON_FAILURE: ${{ inputs.keep-vm-on-failure }}
      run: |
        set -euo pipefail

        workspace="${GITHUB_WORKSPACE:-$PWD}"
        action_root="${GITHUB_ACTION_PATH:-$PWD}"

        # Run the validator the prebuilt step downloaded and verified, by path
        # and pinned digest; the CLI would otherwise prefer a validator already
        # installed under /usr/local/libexec or /usr/libexec on the runner. A
        # workflow that sets BPFCOMPAT_VALIDATOR_BIN or
        # BPFCOMPAT_VALIDATOR_SHA256 itself keeps its own settings unchanged,
        # and the run says that it is not pinned to the attested validator.
        if [[ "${PREBUILT_RESOLVED:-}" == "true" ]]; then
          if [[ -n "${BPFCOMPAT_VALIDATOR_BIN:-}${BPFCOMPAT_VALIDATOR_SHA256:-}" ]]; then
            echo "::warning::BPFCOMPAT_VALIDATOR_BIN or BPFCOMPAT_VALIDATOR_SHA256 is set by the workflow; this run uses the workflow's validator settings, not the attested release validator the action verified."
          else
            export BPFCOMPAT_VALIDATOR_BIN="$PREBUILT_VALIDATOR_BIN"
            export BPFCOMPAT_VALIDATOR_SHA256="$PREBUILT_VALIDATOR_SHA256"
          fi
        fi

        resolve_path() {
          local input="$1"
          if [[ -z "$input" ]]; then
            echo ""
            return
          fi
          if [[ "$input" = /* ]]; then
            echo "$input"
          else
            echo "$workspace/$input"
          fi
        }

        # An artifact is either a local .bpf.o path or a remote OCI reference
        # the CLI pulls itself (ghcr.io/org/gadget:latest, host:port/repo,
        # localhost/..., or an @sha256: digest). A remote ref must bypass path
        # resolution and the local-file existence check below — otherwise it is
        # mangled into "$workspace/ghcr.io/..." and rejected as "not found".
        # Host detection follows the OCI/Docker rule: the segment before the
        # first "/" is a registry host if it contains "." or ":" or is localhost.
        is_remote_artifact() {
          local a="$1"
          case "$a" in
            *://* | *@sha256:*) return 0 ;;
          esac
          local first="${a%%/*}"
          case "$first" in
            "" | "." | "..") return 1 ;;
            localhost | localhost:*) return 0 ;;
          esac
          if [[ "$a" == */* && ( "$first" == *.* || "$first" == *:* ) ]]; then
            return 0
          fi
          return 1
        }

        artifact_input="$INPUT_ARTIFACT"
        artifact_is_remote=false
        if [[ -n "$artifact_input" ]] && is_remote_artifact "$artifact_input"; then
          artifact_path="$artifact_input"
          artifact_is_remote=true
        else
          artifact_path="$(resolve_path "$artifact_input")"
        fi
        matrix_path="$(resolve_path "$INPUT_MATRIX")"
        command_binary_path="$(resolve_path "$INPUT_COMMAND_BINARY")"

        # Built-in matrix convenience: a bare name (e.g. quirk-library) that
        # does not exist in the caller repo resolves to the matrices/ directory
        # shipped with the action.
        if [[ -n "$matrix_path" && ! -f "$matrix_path" ]]; then
          matrix_input="$INPUT_MATRIX"
          if [[ "$matrix_input" != /* && -f "$action_root/matrices/${matrix_input}.yaml" ]]; then
            matrix_path="$action_root/matrices/${matrix_input}.yaml"
          elif [[ "$matrix_input" != /* && -f "$action_root/$matrix_input" ]]; then
            matrix_path="$action_root/$matrix_input"
          fi
        fi
        out_path="$(resolve_path "$INPUT_OUT")"
        manifest_path="$(resolve_path "$INPUT_MANIFEST")"
        markdown_path="$(resolve_path "$INPUT_MARKDOWN")"
        workdir_path="$(resolve_path "$INPUT_WORKDIR")"
        suite_path="$(resolve_path "$INPUT_SUITE")"
        suite_out_path="$(resolve_path "$INPUT_SUITE_OUT")"
        suite_markdown_path="$(resolve_path "$INPUT_SUITE_MARKDOWN")"

        binary_input="$INPUT_BINARY"
        binary_path=""
        if [[ "$binary_input" = /* ]]; then
          binary_path="$binary_input"
        elif [[ -x "$workspace/$binary_input" ]]; then
          binary_path="$workspace/$binary_input"
        elif [[ -x "$action_root/$binary_input" ]]; then
          binary_path="$action_root/$binary_input"
        elif [[ -x "$action_root/bin/bpfcompat" ]]; then
          binary_path="$action_root/bin/bpfcompat"
        fi

        if [[ -z "$binary_path" || ! -x "$binary_path" ]]; then
          echo "::error::bpfcompat binary not found or not executable. Checked: $workspace/$binary_input, $action_root/$binary_input, $action_root/bin/bpfcompat"
          exit 1
        fi

        # Diff mode (baseline-report / candidate-report): compare two existing
        # reports with `bpfcompat diff` and apply the fail-on-* policy. Nothing
        # below this point runs in diff mode.
        if [[ -n "$INPUT_BASELINE_REPORT$INPUT_CANDIDATE_REPORT" ]]; then
          BPFCOMPAT_BIN="$binary_path" exec bash "$action_root/scripts/action-diff.sh"
        fi

        if [[ -n "$suite_path" ]]; then
          if [[ ! -f "$suite_path" ]]; then
            echo "::error::suite file not found: $suite_path"
            exit 1
          fi
          mkdir -p "$(dirname "$suite_out_path")"
          if [[ -n "$suite_markdown_path" ]]; then
            mkdir -p "$(dirname "$suite_markdown_path")"
          fi

          pushd "$action_root" >/dev/null
          cmd=(
            "$binary_path"
            suite
            --suite "$suite_path"
            --out "$suite_out_path"
            --timeout "$INPUT_TIMEOUT"
            --workdir "$workdir_path"
            --concurrency "$INPUT_CONCURRENCY"
          )
          if [[ -n "$suite_markdown_path" ]]; then
            cmd+=(--markdown "$suite_markdown_path")
          fi

          echo "Running: ${cmd[*]}"
          set +e
          "${cmd[@]}"
          status=$?
          set -e

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            if [[ -f "$suite_markdown_path" ]]; then
              cat "$suite_markdown_path" >>"$GITHUB_STEP_SUMMARY" || echo "::warning::failed to write bpfcompat suite summary"
            else
              {
                echo
                echo "# bpfcompat Compatibility Suite"
                echo
                echo "Suite run did not produce a Markdown summary. Check the action logs for setup or runner errors."
              } >>"$GITHUB_STEP_SUMMARY" || true
            fi
          fi

          popd >/dev/null
          exit "$status"
        fi

        if [[ -z "$artifact_path" && -z "$INPUT_COMMAND" ]]; then
          echo "::error::artifact or command is required unless suite is set"
          exit 1
        fi
        if [[ -z "$matrix_path" ]]; then
          echo "::error::matrix is required unless suite is set"
          exit 1
        fi
        if [[ -z "$out_path" ]]; then
          echo "::error::out is required unless suite is set"
          exit 1
        fi

        if [[ -n "$artifact_path" && "$artifact_is_remote" != true && ! -f "$artifact_path" ]]; then
          echo "::error::artifact not found: $artifact_path"
          exit 1
        fi
        if [[ -n "$command_binary_path" && ! -f "$command_binary_path" ]]; then
          echo "::error::command-binary not found: $command_binary_path"
          exit 1
        fi
        if [[ -n "$command_binary_path" && -z "$INPUT_COMMAND" ]]; then
          echo "::error::command-binary requires command"
          exit 1
        fi
        if [[ ! -f "$matrix_path" ]]; then
          echo "::error::matrix not found: $matrix_path"
          exit 1
        fi

        mkdir -p "$(dirname "$out_path")"
        if [[ -n "$markdown_path" ]]; then
          mkdir -p "$(dirname "$markdown_path")"
        fi

        pushd "$action_root" >/dev/null
        cmd=(
          "$binary_path"
          test
          --matrix "$matrix_path"
          --out "$out_path"
          --timeout "$INPUT_TIMEOUT"
          --workdir "$workdir_path"
          --concurrency "$INPUT_CONCURRENCY"
        )

        if [[ -n "$artifact_path" ]]; then
          cmd+=(--artifact "$artifact_path")
        fi
        if [[ -n "$INPUT_COMMAND" ]]; then
          cmd+=(--command "$INPUT_COMMAND")
          if [[ -n "$command_binary_path" ]]; then
            cmd+=(--command-binary "$command_binary_path")
          fi
          if [[ -n "$INPUT_COMMAND_EXPECT_EXIT" && "$INPUT_COMMAND_EXPECT_EXIT" != "0" ]]; then
            cmd+=(--command-expect-exit "$INPUT_COMMAND_EXPECT_EXIT")
          fi
        fi
        if [[ -n "$manifest_path" ]]; then
          cmd+=(--manifest "$manifest_path")
        fi
        if [[ -n "$INPUT_DISK_RESIZE" && "$INPUT_DISK_RESIZE" != "0" ]]; then
          cmd+=(--disk-resize "$INPUT_DISK_RESIZE")
        fi
        if [[ -n "$INPUT_VALIDATION_MODE" ]]; then
          cmd+=(--validation-mode "$INPUT_VALIDATION_MODE")
        fi
        if [[ -n "$markdown_path" ]]; then
          cmd+=(--markdown "$markdown_path")
        fi
        if [[ "$INPUT_KEEP_VM_ON_FAILURE" == "true" ]]; then
          cmd+=(--keep-vm-on-failure=true)
        fi

        echo "Running: ${cmd[*]}"
        set +e
        "${cmd[@]}"
        status=$?
        set -e

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          if [[ -f "$out_path" ]]; then
            {
              echo
              "$binary_path" report-summary --report "$out_path" --max-targets 25 --max-failures 10
            } >>"$GITHUB_STEP_SUMMARY" || echo "::warning::failed to write bpfcompat job summary"
          else
            {
              echo
              echo "# bpfcompat Compatibility Gate"
              echo
              echo "Validation did not produce a JSON report. Check the action logs for setup or runner errors."
            } >>"$GITHUB_STEP_SUMMARY" || true
          fi
        fi

        popd >/dev/null
        exit "$status"

branding:
  icon: shield
  color: blue
