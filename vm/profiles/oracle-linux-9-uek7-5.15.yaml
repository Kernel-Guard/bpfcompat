id: oracle-linux-9-uek7-5.15
distro: oracle
version: "9"
kernel_family: "5.15"
arch: x86_64
# The OL9U7 template boots UEK8 (6.12). This profile validates UEK7 (5.15),
# the series its id names, so it installs a pinned UEK R7 kernel from Oracle's
# OL9 UEKR7 repository. (The 6.12-on-EL9 case is covered by the exact-kernel
# profile oracle-linux-9-uek7-5.15-k6.12.0-204.92.4.4.el9uek.)
install_kernel: 5.15.0-325.221.6.1.el9uek.x86_64
kernel_packages:
  - "https://yum.oracle.com/repo/OracleLinux/OL9/UEKR7/x86_64/getPackage/kernel-uek-core-5.15.0-325.221.6.1.el9uek.x86_64.rpm"
  - "https://yum.oracle.com/repo/OracleLinux/OL9/UEKR7/x86_64/getPackage/kernel-uek-modules-5.15.0-325.221.6.1.el9uek.x86_64.rpm"
  - "https://yum.oracle.com/repo/OracleLinux/OL9/UEKR7/x86_64/getPackage/kernel-uek-5.15.0-325.221.6.1.el9uek.x86_64.rpm"
image:
  source_url: "https://yum.oracle.com/templates/OracleLinux/OL9/u7/x86_64/OL9U7_x86_64-kvm-b269.qcow2"
  local_path: "vm/cache/oracle-linux-9-uek7-5.15.qcow2"
boot:
  memory_mb: 1024
  cpus: 1
validator:
  path: "/usr/local/bin/bpfcompat-validator"
capabilities:
  expected_btf: true
